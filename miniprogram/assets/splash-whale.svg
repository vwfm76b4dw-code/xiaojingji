<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144"
     preserveAspectRatio="xMidYMid meet">
  <!-- 小鲸记单词 · 开屏鲸（2026-09-24）
       从 out/logo/纸白鲸.svg 的鲸形组派生：**去掉背景矩形与四周描边**，
       并把两粒气泡也去掉 —— 气泡在开屏里改用 <view> 单独驱动动画
       （小程序 <image> 加载的 SVG 无法用 WXSS 动画到内部元素，
         所以可动的部分必须是原生节点，不可动的轮廓才留给 SVG）。

       配色：鲸身 #00825C 主题绿 / 眼睛·嘴线 #FAF6EC 米白（对应纸底上的品牌反色）

       ⚠️ image 组件的 SVG 限制（官方文档明列）：
          · 不支持百分比单位 —— 本文件全部用绝对坐标，别改成 %；
          · 不支持 <style> element —— 样式只能写成属性；
          · mode=scaleToFill 时 WebView 会居中，所以调用处用 aspectFit。 -->

